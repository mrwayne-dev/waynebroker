; ============================================================
; PHP per-directory overrides
;
; Read by PHP-FPM / CGI SAPIs, which ignore the php_value directives in
; .htaccess (those are mod_php only, and are fatal there - hence the
; <IfModule mod_php.c> guard around them).
;
; Keep these in step with .htaccess, assets/js/profile.js and
; api/backend/upload_avatar.php. The app enforces 10 MB; these sit
; underneath it with headroom for multipart overhead, and post_max_size
; must stay larger than upload_max_filesize or the request body is
; discarded before PHP ever populates $_FILES.
;
; Note: PHP caches this file for user_ini.cache_ttl seconds (default 300),
; so a change here can take up to five minutes to take effect.
; ============================================================

upload_max_filesize = 12M
post_max_size = 14M
