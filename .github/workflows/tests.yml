name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # The test suite moved from SQLite in-memory to MySQL in eeefb03, because
    # Phase 1's ledger rests on SELECT ... FOR UPDATE and CHECK constraints and
    # SQLite has neither. This service is what the suite connects to.
    #
    # The password below is not a secret. It belongs to a container that exists
    # only for the life of this job, is reachable only from this runner, and is
    # thrown away afterwards. Putting a repository secret here would imply it
    # guards something, and it does not.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-aeTh8oog1Chai9oo
          MYSQL_DATABASE: waynebroker_testing
          MYSQL_USER: waynebroker
          MYSQL_PASSWORD: ci-waynebroker-Ahqu5aiPh9ohTh2i
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # `composer setup` runs its own `artisan migrate` from .env.example, so
      # this step is the fresh-clone smoke test: a clone, a key, the schema, a
      # build. It used to run without the MySQL environment, on the theory that
      # only the suite needed the service and that keeping them apart showed
      # which step depended on it. That was wrong in a way that cost four red
      # runs: .env.example pointed at SQLite :memory:, so this step was
      # migrating a second engine nothing else used, and the wallets migration's
      # CHECK constraints — which SQLite's ALTER TABLE cannot add — failed here
      # while the whole MySQL suite was green. .env.example now says MySQL, and
      # this step gets the credentials for it, so a migration that cannot run on
      # the real engine fails on the step whose job is to find that out.
      - name: Setup Application
        env:
          DB_DATABASE: waynebroker_testing
          DB_PASSWORD: ci-waynebroker-Ahqu5aiPh9ohTh2i
        run: composer setup

      - name: Run CI Checks
        env:
          # Host, port, database and username come from phpunit.xml. Only the
          # password is environment-supplied, so that no credential — not even a
          # throwaway one — has to live in a file the suite reads.
          DB_PASSWORD: ci-waynebroker-Ahqu5aiPh9ohTh2i
        run: composer ci:check

      - name: Run Vitest
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `php artisan serve` itself through its
      # webServer block, and reuseExistingServer is false under CI. That server
      # inherits this step's environment, which is why the database lives here:
      # on .env.example alone it would boot against SQLite :memory:, where each
      # connection gets an empty database and the first session write 500s
      # before any assertion runs. The migrate is explicit rather than inherited
      # from the Pest run, so this step does not depend on what another step
      # happened to leave behind.
      - name: Run Playwright
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: waynebroker_testing
          DB_USERNAME: waynebroker
          DB_PASSWORD: ci-waynebroker-Ahqu5aiPh9ohTh2i
        run: |
          php artisan migrate --force
          npx playwright test

  # Intentionally does nothing yet: populated when hosting audit is done.
  #
  # The target is a shared cPanel/LiteSpeed account on a different physical
  # host from Maveren's (plan A5, R4). Until that host is audited we do not
  # know whether SSH is available, which PHP version it runs, or where the
  # docroot points, and every one of those changes the shape of this job.
  #
  # When it is written, the Maveren deploy hazards it must not reproduce are
  # named in docs/architecture.md: H-6 (deploy re-applying a live
  # deposit-address SQL file) and M-11 (secrets rsynced into the docroot).
  # The release is built from a clean checkout with explicit includes — never
  # from a working tree.
  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: false
    steps:
      - name: Placeholder
        run: echo "Deploy pipeline is not configured yet."
