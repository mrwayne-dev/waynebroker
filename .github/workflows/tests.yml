name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  # Intentionally does nothing yet: populated when hosting audit is done.
  #
  # The target is a shared cPanel/LiteSpeed account on a different physical
  # host from Maveren's (plan A5, R4). Until that host is audited we do not
  # know whether SSH is available, which PHP version it runs, or where the
  # docroot points, and every one of those changes the shape of this job.
  #
  # When it is written, the Maveren deploy hazards it must not reproduce are
  # named in docs/architecture.md: H-6 (deploy re-applying a live
  # deposit-address SQL file) and M-11 (secrets rsynced into the docroot).
  # The release is built from a clean checkout with explicit includes — never
  # from a working tree.
  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: false
    steps:
      - name: Placeholder
        run: echo "Deploy pipeline is not configured yet."
